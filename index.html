<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Один вечер — одна ночь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="particles"></canvas>

    <header class="hero">
        <div class="hero-content">
            <p class="hero-date">11 · 10</p>
            <h1 class="hero-title">Один вечер<br><span class="title-accent">одна ночь</span></h1>
            <p class="hero-subtitle">Выбери одно место. Только одно.</p>
        </div>
    </header>

    <section class="voting-section">
        <div class="container">

            <div class="name-block">
                <label for="voterName">Как тебя зовут?</label>
                <input type="text" id="voterName" placeholder="Введи своё имя..." maxlength="50">
            </div>

            <!-- Загородный дом -->
            <div class="category">
                <h2 class="category-title">
                    <span class="category-emoji">🏠</span>
                    Загородный дом
                </h2>
                <div class="options-grid" id="houseOptions"></div>
            </div>

            <!-- Кальянка -->
            <div class="category">
                <h2 class="category-title">
                    <span class="category-emoji">💨</span>
                    Кальянная
                </h2>
                <div class="options-grid" id="hookahOptions"></div>
            </div>

            <!-- Сауна -->
            <div class="category">
                <h2 class="category-title">
                    <span class="category-emoji">🧖</span>
                    Сауна
                </h2>
                <div class="options-grid" id="saunaOptions"></div>
            </div>

            <div class="selected-info" id="selectedInfo">
                <p>Ничего не выбрано</p>
            </div>

            <button class="vote-btn" onclick="vote()">Проголосовать</button>

        </div>
    </section>

    <section class="blacklist-section">
        <div class="container">
            <h2 class="blacklist-title">Чёрный список</h2>
            <p class="blacklist-subtitle">Этим людям вход воспрещён (шутка, но не совсем)</p>
            <div class="blacklist" id="blacklistContainer"></div>
        </div>
    </section>

    <footer class="footer">
        <p>11.10 — один вечер, одна ночь</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
