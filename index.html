<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11.10.2006 — Днюха Владислава 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Частицы на фоне -->
    <canvas id="particles"></canvas>

    <!-- Заголовок -->
    <header class="hero">
        <div class="hero-content">
            <p class="hero-date">11.10.2006</p>
            <h1 class="hero-title">Днюха Владислава</h1>
            <p class="hero-subtitle">Помоги выбрать, где будем отмечать 🎉</p>
        </div>
    </header>

    <!-- Голосование -->
    <section class="voting-section">
        <div class="container">

            <!-- Имя -->
            <div class="name-block">
                <label for="voterName">Как тебя зовут?</label>
                <input type="text" id="voterName" placeholder="Введи своё имя..." maxlength="50">
            </div>

            <!-- Загородный дом -->
            <div class="category">
                <h2 class="category-title">
                    <span class="category-emoji">🏠</span>
                    Загородный дом
                </h2>
                <div class="options-grid" id="houseOptions"></div>
            </div>

            <!-- Кальянка -->
            <div class="category">
                <h2 class="category-title">
                    <span class="category-emoji">💨</span>
                    Кальянная
                </h2>
                <div class="options-grid" id="hookahOptions"></div>
            </div>

            <!-- Сауна -->
            <div class="category">
                <h2 class="category-title">
                    <span class="category-emoji">🧖</span>
                    Сауна
                </h2>
                <div class="options-grid" id="saunaOptions"></div>
            </div>

            <!-- Кнопка -->
            <button class="vote-btn" onclick="vote()">🎉 Проголосовать</button>

        </div>
    </section>

    <!-- ЧЁРНЫЙ СПИСОК -->
    <section class="blacklist-section">
        <div class="container">
            <h2 class="blacklist-title">🚫 ЧЁРНЫЙ СПИСОК</h2>
            <p class="blacklist-subtitle">Этим людям вход воспрещён (шутка, но не совсем)</p>
            <div class="blacklist" id="blacklistContainer"></div>
        </div>
    </section>

    <footer class="footer">
        <p>Сделано с ❤️ специально для днюхи</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
